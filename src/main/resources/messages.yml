# ============================================================
# GriefPrevention - English Messages
# ============================================================
# To change the language, copy the desired messages_XX.yml file
# from the Lang/ folder to GriefPreventionData/ and rename it:
#   plugins/GriefPreventionData/messages.yml
#
# The plugin loads messages in this order:
#   1. messages.yml (your customized or locale file)
#   2. messages_{locale}.yml (based on GriefPrevention.Locale in config)
#   3. messages_en.yml (fallback)
#
# Formatting: use $ or & for color codes.
# Newlines: use \n in messages.
# ============================================================

