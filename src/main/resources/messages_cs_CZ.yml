# ============================================================
# GriefPrevention - Zprávy v češtině
# ============================================================
# Chcete-li změnit jazyk, zkopírujte požadovaný soubor messages_XX.yml
# ze složky Lang/ do GriefPreventionData/ a přejmenujte jej:
#   plugins/GriefPreventionData/messages.yml
#
# Plugin načítá zprávy v tomto pořadí:
#   1. messages.yml (váš vlastní nebo lokalizovaný soubor)
#   2. messages_{locale}.yml (podle GriefPrevention.Locale v configu)
#   3. messages_en.yml (záložní)
#
# Formátování: použij $ nebo & pro barevné kódy.
# Nové řádky: použij \n ve zprávách.
# ============================================================

